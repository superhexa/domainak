# Extra settings for the records zone this container serves (RECORDS_ZONE,
# see server/config.ts). The image's own /etc/powerdns/pdns.conf already
# selects launch=gsqlite3, points the sqlite database at
# /var/lib/powerdns/pdns.sqlite3 and includes this directory.
#
# The HTTP API used by the backend is generated from the PDNS_AUTH_API_KEY
# environment variable (PDNS_API_KEY in docker-compose.yaml): it listens on
# 0.0.0.0:8081, which compose only publishes on 127.0.0.1, never publicly.

local-port=53

# Zone transfers are not needed: there is a single authoritative server.
disable-axfr=yes
default-ttl=300
